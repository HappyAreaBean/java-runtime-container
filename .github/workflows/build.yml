name: build java
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"
  push:
    branches:
      - main
    paths:
      - liberica/**
      - openj9/**
      - temurin/**
permissions:
  packages: write

jobs:
  push:
    name: "java-runtime-container:${{ matrix.distribution }}-${{ matrix.tag }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: liberica
            tag: 21-glibc
          - distribution: liberica
            tag: 21-musl
          # - distribution: liberica
          #   tag: 25-glibc
          # - distribution: liberica
          #   tag: 25-musl
          # - distribution: liberica
          #   tag: 27-glibc
          # - distribution: liberica
          #   tag: 27-musl
          # - distribution: openj9
          #   tag: "25"
          # - distribution: temurin
          #   tag: "25"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-flags: --debug
      - id: lower-repo
        name: Repository to lowercase
        run: |
          echo "repository=${GITHUB_REPOSITORY_OWNER@L}" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ steps.lower-repo.outputs.repository }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.distribution }}/${{ matrix.tag }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.lower-repo.outputs.repository }}/java-runtime-container:${{ matrix.distribution }}-${{ matrix.tag }}
